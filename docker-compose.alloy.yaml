services:
  site:
    image: python:3.12-alpine
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace:ro
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
    command: python -m http.server 3000 --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
